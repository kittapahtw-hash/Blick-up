<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<style>[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}</style>
<title>DC Bill Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#F6F6F7;--surface:#FFFFFF;--surface2:#F1F1F2;--ink:#1A1A1C;--ink2:#46474A;--muted:#707174;--line:#E4E4E6;
  --accent:#D7262F;--accent-soft:#FCEBEC;--on-accent:#FFFFFF;--steel:#3F4145;--steel-soft:#ECECEE;
  --red:#A61B1B;--red-soft:#F9E3E1;--amber:#B26B00;--amber-soft:#FCF1DE;--green:#1B8752;--green-soft:#E5F4EC;--grey-soft:#EEEEF0;
  --shadow:0 1px 2px rgba(20,20,22,.05),0 8px 24px rgba(20,20,22,.06);
  --font:"IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;--bg:#0F0F10;--surface:#18181A;--surface2:#1F1F22;--ink:#EDEDEE;--ink2:#C8C8CC;--muted:#939397;--line:#2B2B2F;
  --accent:#FF4F58;--accent-soft:#3A1A1D;--on-accent:#140606;--steel:#D4D4D8;--steel-soft:#2A2A2E;
  --red:#FF8A7A;--red-soft:#3B1E1A;--amber:#E7B04E;--amber-soft:#35291A;--green:#4CC48A;--green-soft:#17301F;--grey-soft:#242428;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);}}
:root[data-theme="dark"]{
  color-scheme:dark;--bg:#0F0F10;--surface:#18181A;--surface2:#1F1F22;--ink:#EDEDEE;--ink2:#C8C8CC;--muted:#939397;--line:#2B2B2F;
  --accent:#FF4F58;--accent-soft:#3A1A1D;--on-accent:#140606;--steel:#D4D4D8;--steel-soft:#2A2A2E;
  --red:#FF8A7A;--red-soft:#3B1E1A;--amber:#E7B04E;--amber-soft:#35291A;--green:#4CC48A;--green-soft:#17301F;--grey-soft:#242428;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5;margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:20px 60px}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

header.top{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:14px}
.brand .logo{height:44px;width:auto;flex:none}
.brand .sep{width:1px;align-self:stretch;background:var(--line)}
.brand h1{font-size:22px;margin:0;letter-spacing:-.01em;font-weight:700;text-wrap:balance}
.brand p{margin:2px 0 0;color:var(--muted);font-size:13px}
.monthnav{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px}
.monthnav button{border:0;background:transparent;border-radius:7px;padding:6px 10px;color:var(--ink2)}
.monthnav button:hover{background:var(--surface2)}
.monthnav .lbl{min-width:132px;text-align:center;font-weight:600}
.monthnav .lbl small{display:block;font-weight:400;color:var(--muted);font-size:11px;line-height:1.2}

.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-align:left;border-left-width:1px}
.kpi .v{font-size:24px;font-weight:600;line-height:1.1}
.kpi .l{font-size:12px;color:var(--muted);margin-top:4px}
.kpi.red .v{color:var(--red)}.kpi.amber .v{color:var(--amber)}.kpi.green .v{color:var(--green)}
.bar{height:6px;border-radius:99px;background:var(--grey-soft);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--green);border-radius:99px}
button.kpi{cursor:pointer;font:inherit;color:inherit}
button.kpi:hover{border-color:var(--accent)}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tabs .cnt{font-family:var(--mono);font-size:11px;background:var(--surface2);border-radius:99px;padding:1px 7px;margin-left:6px;color:var(--ink2)}
.tabs .cnt.hot{background:var(--red-soft);color:var(--red)}

.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.toolbar .sp{flex:1}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.search{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;min-width:0;width:220px;max-width:100%}

.sec{margin-bottom:18px}
.sec h3{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;font-weight:600;display:flex;gap:8px;align-items:center}
.sec h3 .dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sec h3 .dot.red{background:var(--red)}.sec h3 .dot.amber{background:var(--amber)}.sec h3 .dot.acc{background:var(--accent)}.sec h3 .dot.green{background:var(--green)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:grid;grid-template-columns:22px 170px minmax(0,1fr) 150px 92px;gap:12px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row:hover{background:var(--surface2)}
.row.isdone .ttl{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.row input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent)}
.ttl{font-weight:600;cursor:pointer;overflow-wrap:anywhere}
.ttl:hover{color:var(--accent)}
.meta{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:2px}
.tag{font-size:11px;border-radius:5px;padding:0 6px;background:var(--grey-soft);color:var(--ink2);white-space:nowrap}
.tag.warn{background:var(--amber-soft);color:var(--amber)}
.tag.acc{background:var(--steel-soft);color:var(--steel)}
.tag.red{background:var(--red-soft);color:var(--red)}
select.pill{appearance:none;-webkit-appearance:none;border:1px solid transparent;border-radius:99px;padding:4px 26px 4px 10px;font-size:12px;font-weight:600;width:100%;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);
  background-position:calc(100% - 13px) 55%,calc(100% - 9px) 55%;background-size:4px 4px;background-repeat:no-repeat}
.b-todo{background-color:var(--grey-soft);color:var(--ink2)}
.b-doc,.b-doing{background-color:var(--steel-soft);color:var(--steel)}
.b-ipro{background-color:var(--steel);color:var(--surface)}
.b-send{background-color:var(--amber-soft);color:var(--amber)}
.b-block{background-color:var(--red-soft);color:var(--red)}
.b-done{background-color:var(--green-soft);color:var(--green)}
.b-skip{background-color:var(--grey-soft);color:var(--muted)}
.date{font-size:12px;line-height:1.35}
.date b{font-weight:600}
.date.red b{color:var(--red)}.date.amber b{color:var(--amber)}
.date span{color:var(--muted);display:block}
.next{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 8px;font-size:12px;color:var(--ink2);white-space:nowrap}
.next:hover{border-color:var(--accent);color:var(--accent)}
.empty{padding:22px;text-align:center;color:var(--muted)}
details.dormant summary{cursor:pointer;color:var(--muted);font-size:13px;padding:6px 2px}
.bulkbar{display:flex;gap:8px;align-items:center;background:var(--accent-soft);color:var(--accent);border-radius:10px;padding:8px 12px;margin-bottom:10px;flex-wrap:wrap}
.bulkbar select{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:5px 8px}

.board{display:grid;grid-template-columns:repeat(5,minmax(200px,1fr));gap:10px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--surface2);border-radius:12px;padding:10px;min-height:120px}
.col h4{margin:0 0 8px;font-size:12px;display:flex;justify-content:space-between;color:var(--ink2);font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 10px;margin-bottom:8px}
.card .ttl{font-size:13px}
.card .ft{display:flex;justify-content:space-between;align-items:center;margin-top:6px;gap:6px}

.week{display:grid;grid-template-columns:repeat(7,minmax(130px,1fr));gap:8px;overflow-x:auto;padding-bottom:6px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px;min-height:110px}
.day.today{border-color:var(--accent)}
.day h5{margin:0 0 6px;font-size:12px;color:var(--muted);font-weight:600;display:flex;justify-content:space-between}
.day.today h5{color:var(--accent)}
.chip{display:block;font-size:12px;border-radius:6px;padding:4px 6px;margin-bottom:4px;cursor:pointer;border:0;width:100%;text-align:left}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,12,16,.35);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--surface);border-left:1px solid var(--line);box-shadow:var(--shadow);z-index:21;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.dh{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
.dh h2{font-size:17px;margin:0;flex:1;text-wrap:balance}
.db{padding:16px 18px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:16px}
.steps{display:flex;flex-direction:column;gap:4px}
.step{display:flex;gap:10px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;text-align:left;font-size:13px}
.step .n{font-family:var(--mono);font-size:11px;color:var(--muted);width:20px}
.step.past{color:var(--muted)}
.step.cur{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.step.bad.cur{border-color:var(--red);background:var(--red-soft);color:var(--red)}
.kv{display:grid;grid-template-columns:110px minmax(0,1fr);gap:6px 12px;font-size:13px}
.kv dt{color:var(--muted)}.kv dd{margin:0;overflow-wrap:anywhere}
.fld label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.fld input,.fld textarea,.fld select{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px}
.fld textarea{min-height:70px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lbl2{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0 0 6px}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:13px;padding:3px 0}
.chk input{margin-top:3px;accent-color:var(--accent)}
.copy{border:1px solid var(--line);background:var(--surface2);border-radius:6px;padding:1px 7px;font-size:11px;margin-left:6px}
.log{font-size:12px;color:var(--muted)}
.note{font-size:12px;color:var(--muted)}
.banner{background:var(--amber-soft);color:var(--amber);border-radius:10px;padding:10px 14px;margin-bottom:12px;font-size:13px}
.saved{font-size:12px;color:var(--muted);min-height:18px}
.tbl{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.tbl table{border-collapse:collapse;width:100%;min-width:760px;font-size:13px}
.tbl th,.tbl td{padding:8px 12px;border-top:1px solid var(--line);text-align:left;vertical-align:top}
.tbl th{border-top:0;font-size:12px;color:var(--muted);font-weight:600;background:var(--surface2)}
.tbl tr:hover td{background:var(--surface2);cursor:pointer}


/* cost page */
.seg{display:inline-flex;background:var(--surface2);border-radius:9px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:7px;padding:6px 12px;color:var(--muted);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.fchip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 11px;font-size:12px;color:var(--ink2)}
.fchip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.src{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;margin-bottom:12px}
.src .ok{color:var(--green)}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px 8px;margin-bottom:14px}
.chart h4{margin:0 0 6px;font-size:13px;font-weight:600;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.chart h4 span{color:var(--muted);font-weight:400}
.chart svg{display:block;width:100%;height:auto}
.chart .bar-r{fill:var(--accent)}
.chart .bar-r.old{fill:var(--accent);opacity:.35}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--mono)}
.chart .grid{stroke:var(--line);stroke-width:1}
.ltbl{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.ltbl table{border-collapse:separate;border-spacing:0;width:100%;font-size:12.5px}
.ltbl th,.ltbl td{padding:7px 10px;border-top:1px solid var(--line);white-space:nowrap;text-align:right}
.ltbl th{border-top:0;background:var(--surface2);color:var(--muted);font-weight:600;font-size:11.5px;position:sticky;top:0}
.ltbl td.l,.ltbl th.l{text-align:left}
.ltbl .stick{position:sticky;left:0;background:var(--surface);z-index:1;min-width:230px;max-width:280px;white-space:normal}
.ltbl th.stick{background:var(--surface2);z-index:2}
.ltbl tr.sec td{background:var(--surface2);font-weight:600;color:var(--ink)}
.ltbl tr.sec td.stick{background:var(--surface2)}
.ltbl tr.r:hover td{background:var(--surface2);cursor:pointer}
.ltbl td.cur,.ltbl th.cur{background:var(--accent-soft)}
.ltbl td.z{color:var(--line)}
.ltbl .v{font-weight:600}
.ltbl .d{color:var(--muted);font-size:11.5px}
.code{font-family:var(--mono);font-size:12px;border:1px solid var(--line);background:var(--surface2);border-radius:6px;padding:1px 7px;cursor:pointer;color:var(--ink);white-space:nowrap}
.code:hover{border-color:var(--accent);color:var(--accent)}
.code.inf{border-style:dashed}
.code.empty{color:var(--muted);cursor:default}
.pobox{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.pobox .h{font-size:13px;font-weight:600}
.pogrid{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:center;font-size:12px}
.pogrid dt{color:var(--muted)}.pogrid dd{margin:0;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.warnline{font-size:12px;color:var(--amber)}
.capbar{height:6px;border-radius:99px;background:var(--grey-soft);overflow:hidden;min-width:80px}
.capbar i{display:block;height:100%;background:var(--accent)}
.capbar i.full{background:var(--green)}
select.mini{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:2px 6px;font-size:12px;max-width:220px}
.tdadd{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:16px;display:flex;flex-direction:column;gap:10px}
.tdin{border:0;background:transparent;font-size:15px;padding:4px 2px;width:100%}
.tdin:focus{outline:none}
.tdopts{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center}
.row.td{grid-template-columns:22px 70px minmax(0,1fr) 150px 92px}
@media (max-width:820px){
  .row.td{grid-template-columns:22px minmax(0,1fr) auto}
  .brand .logo{height:34px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpis .kpi:first-child{grid-column:1/-1}
  .row{grid-template-columns:22px minmax(0,1fr) auto;grid-template-areas:"c t t" "c s d" "c n n"}
  .row>.c1{grid-area:c}.row>.c2{grid-area:s}.row>.c3{grid-area:t}.row>.c4{grid-area:d;text-align:right}.row>.c5{grid-area:n}
  .row .next{width:100%}
  .search{width:100%}
}
@media (prefers-reduced-motion:no-preference){.drawer{animation:sl .18s ease-out}@keyframes sl{from{transform:translateX(24px);opacity:.6}}}
</style>

</head>
<body>
<div class="wrap">

      <option value="">ทุกประเภท</option><option value="bill">วางบิล</option><option value="routine">งานประจำ</option>
    </select>
    <span class="sp"></span>
    <button class="btn primary" id="addBtn">+ To-do</button>
  </div>

  <div id="bulk" class="bulkbar" hidden>
    <span id="bulkN">0 รายการ</span>
    <select id="bulkSel" aria-label="ตั้งสถานะที่เลือก"></select>
    <button class="btn" id="bulkGo">ใช้กับที่เลือก</button>
    <button class="btn ghost" id="bulkClr">ยกเลิก</button>
  </div>

  <main id="view"></main>
</div>

<div id="scrim" class="scrim" hidden></div>
<aside id="drawer" class="drawer" hidden aria-modal="true" role="dialog"></aside>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/store.js"></script>
<script>
(function(){
const TH_M=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const EN_M=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const TH_D=['อา','จ','อ','พ','พฤ','ศ','ส'];
const BILL=[
 {k:'00',t:'ยังไม่เริ่ม',b:'todo'},{k:'01',t:'01 ได้รับอีเมลแล้ว',b:'doc'},{k:'02',t:'02 ได้รับเอกสารแล้ว',b:'doc'},
 {k:'03',t:'03 เปิด IPO แล้ว',b:'ipro'},{k:'04',t:'04 Approve แล้ว',b:'ipro'},{k:'05',t:'05 ไม่ Approve',b:'block'},
 {k:'06',t:'06 แจ้งคุณหม่ำเจ็น PO',b:'send'},{k:'07',t:'07 เตรียมส่งบัญชี',b:'send'},{k:'08',t:'08 ส่งบัญชีแล้ว',b:'done'},
 {k:'NA',t:'ไม่มีบิลเดือนนี้',b:'skip'}];
const ROUT=[{k:'00',t:'ยังไม่ทำ',b:'todo'},{k:'10',t:'กำลังทำ',b:'doing'},{k:'99',t:'เสร็จแล้ว',b:'done'},{k:'NA',t:'ไม่ต้องทำ',b:'skip'}];
const NEXT_B={'00':'01','01':'02','02':'03','03':'04','04':'06','05':'03','06':'07','07':'08'};
const NEXT_R={'00':'10','10':'99'};
const BOARD=[['todo','ยังไม่เริ่ม'],['doc','เอกสาร'],['ipro','iPro · Approve'],['send','เตรียมส่งบัญชี'],['done','ส่งบัญชีแล้ว']];

let db=null, T={}, S={}, ready={t:false,s:false};
const today=startOfDay(new Date());
let cur=new Date(today.getFullYear(),today.getMonth(),1);
let view='today', sel=new Set(), openId=null;
try{const v=localStorage.getItem('dbd.view'); if(v) view=v;}catch(e){}

function startOfDay(d){return new Date(d.getFullYear(),d.getMonth(),d.getDate())}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function mkey(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
function parseYmd(s){if(!s)return null;const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function fmt(d){return d? d.getDate()+' '+TH_M[d.getMonth()] : '—'}
function fmtD(d){return TH_D[d.getDay()]+' '+fmt(d)}
function diff(a,b){return Math.round((a-b)/864e5)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function dim(y,m){return new Date(y,m+1,0).getDate()}
function steps(t){return t.kind==='bill'?BILL:ROUT}
function stepOf(t,k){return steps(t).find(s=>s.k===k)||steps(t)[0]}

/* ---------- instance generation ---------- */
function genMonth(y,m){
  const out=[], mk=y+'-'+String(m+1).padStart(2,'0');
  for(const t of Object.values(T)){
    if(t.active===false) continue;
    if(t.cadence==='monthly'){
      const due=new Date(y,m,Math.min(t.dueDay||15,dim(y,m)));
      const rec=t.receiveDay? new Date(y,m,Math.min(t.receiveDay,dim(y,m))) : null;
      out.push({id:t.id+'__'+mk,t,period:mk,label:EN_M[m]+' '+String(y).slice(2),due,rec});
    } else if(t.cadence==='weekly'){
      const ws=t.weekStart??2;
      let d=new Date(y,m,1); while(d.getDay()!==ws) d=addDays(d,1);
      // include week that started last month but ends in this month
      let s=addDays(d,-7); if(addDays(s,6).getMonth()!==m) s=d;
      for(;s.getMonth()===m||addDays(s,6).getMonth()===m;s=addDays(s,7)){
        const e=addDays(s,6); if(e.getMonth()!==m) break;
        out.push({id:t.id+'__W'+ymd(s),t,period:mk,label:fmt(s)+'–'+fmt(e),due:addDays(e,t.dueOffset??1),rec:null,ws:s,we:e});
      }
    } else if(t.cadence==='once'){
      const d=parseYmd(t.dueDate); if(d&&d.getFullYear()===y&&d.getMonth()===m) out.push({id:t.id+'__once',t,period:mk,label:'',due:d,rec:null});
    }
  }
  for(const s of Object.values(S)){
    if(s.adhocTask&&s.period===mk){
      const t={id:s.id,kind:'routine',cadence:'adhoc',title:s.title,vendor:s.vendor||'',notes:s.note?[s.note]:[],adhocTask:true};
      out.push({id:s.id,t,period:mk,label:'',due:parseYmd(s.dueDate),rec:null});
    }
  }
  return out.map(enrich);
}
function enrich(i){
  const st=S[i.id]||{}; i.st=st; i.status=st.status||'00';
  const step=stepOf(i.t,i.status); i.bucket=step.b;
  i.done=(i.bucket==='done'||i.bucket==='skip');
  i.dormant=!!i.t.adhoc && i.status==='00';
  i.overdue=!i.done && !i.dormant && i.due && today>i.due;
  i.chase=!i.done && !i.dormant && i.t.kind==='bill' && i.rec && ['00','01'].includes(i.status) && today>=i.rec;
  i.action=(i.t.kind==='bill'&&i.rec&&['00','01'].includes(i.status))? i.rec : i.due;
  return i;
}
function around(){ // current month +/- 1 for week/today views
  const y=today.getFullYear(), m=today.getMonth(); const all={};
  for(const k of [-1,0,1]){const d=new Date(y,m+k,1); for(const i of genMonth(d.getFullYear(),d.getMonth())) all[i.id]=i;}
  return Object.values(all);
}
function filt(list){
  const q=document.getElementById('q').value.trim().toLowerCase(), k=document.getElementById('fKind').value;
  return list.filter(i=>(!k||i.t.kind===k)&&(!q||[i.t.title,i.t.vendor,i.t.vendorCode,(i.t.items||[]).map(x=>x.code+' '+x.desc).join(' '),i.st.poNo].join(' ').toLowerCase().includes(q)));
}
const sortA=(a,b)=>(a.action||0)-(b.action||0)||(a.t.order||0)-(b.t.order||0);

/* ---------- rendering ---------- */
function statusSelect(i){
  return `<select class="pill b-${i.bucket}" data-st="${esc(i.id)}" aria-label="สถานะ ${esc(i.t.title)}">${steps(i.t).map(s=>`<option value="${s.k}"${s.k===i.status?' selected':''}>${esc(s.t)}</option>`).join('')}</select>`;
}
function dateCell(i){
  if(i.done) return `<div class="date"><b>${i.bucket==='skip'?'ข้าม':'เสร็จ'}</b><span>${i.st.updatedAt?fmt(new Date(i.st.updatedAt)):''}</span></div>`;
  if(!i.due) return `<div class="date"><span>ไม่มีกำหนด</span></div>`;
  const dd=diff(i.due,today);
  if(i.overdue) return `<div class="date red"><b>เลย ${-dd} วัน</b><span>ส่งบัญชี ${fmt(i.due)}</span></div>`;
  if(i.chase) return `<div class="date amber"><b>ตามเอกสาร</b><span>ควรได้ ${fmt(i.rec)} · ส่ง ${fmt(i.due)}</span></div>`;
  const lbl=i.t.kind==='bill'?'ส่งบัญชี':'กำหนด';
  return `<div class="date${dd<=2?' amber':''}"><b>${dd===0?'วันนี้':dd===1?'พรุ่งนี้':'อีก '+dd+' วัน'}</b><span>${lbl} ${fmt(i.due)}${i.rec&&['00','01'].includes(i.status)?' · เอกสาร '+fmt(i.rec):''}</span></div>`;
}
function tags(i){
  const t=i.t, a=[];
  if(t.kind==='routine') a.push(`<span class="tag acc">${t.cadence==='weekly'?'รายสัปดาห์':t.cadence==='monthly'?'รายเดือน':t.cadence==='once'?'รายปี/ครั้งเดียว':'งานเพิ่ม'}</span>`);
  if(i.label&&t.cadence!=='monthly') a.push(`<span>${esc(i.label)}</span>`);
  if(t.vendorCode) a.push(`<span class="num">${esc(t.vendorCode)}</span>`);
  if(t.items&&t.items.length) a.push(`<span>${t.items.length} รายการ</span>`);
  if(t.pay) a.push(`<span>${esc(t.pay)}</span>`);
  if(t.wht) a.push(`<span class="tag">WHT ${esc(t.wht)}</span>`);
  if(t.emailFirst) a.push(`<span class="tag">ส่งเมลมาก่อน</span>`);
  if(t.cutoff15) a.push(`<span class="tag warn">หลัง 15 = เดือนถัดไป</span>`);
  if(t.confirm) a.push(`<span class="tag warn">วันที่ต้องยืนยัน</span>`);
  if(i.st.poNo) a.push(`<span class="num">PO ${esc(i.st.poNo)}</span>`);
  return a.join('');
}
function rowHTML(i){
  const nx=(i.t.kind==='bill'?NEXT_B:NEXT_R)[i.status];
  const nxT=nx?stepOf(i.t,nx).t.replace(/^\d\d /,''):'';
  return `<div class="row${i.done?' isdone':''}">
    <div class="c1"><input type="checkbox" data-sel="${esc(i.id)}" ${sel.has(i.id)?'checked':''} aria-label="เลือก"></div>
    <div class="c2">${statusSelect(i)}</div>
    <div class="c3"><div class="ttl" data-open="${esc(i.id)}">${esc(i.t.title)}</div><div class="meta">${i.t.vendor&&i.t.vendor!==i.t.title?`<span>${esc(i.t.vendor)}</span>`:''}${tags(i)}</div></div>
    <div class="c4">${dateCell(i)}</div>
    <div class="c5">${nx&&!i.dormant?`<button class="next" data-next="${esc(i.id)}" title="ไปขั้น: ${esc(nxT)}">→ ${esc(nxT.length>10?'ขั้นถัดไป':nxT)}</button>`:i.dormant?`<button class="next" data-activate="${esc(i.id)}">มีบิลเข้า</button>`:''}</div>
  </div>`;
}
function listSec(title,dot,items,emptyTxt){
  if(!items.length&&!emptyTxt) return '';
  return `<section class="sec"><h3><span class="dot ${dot}"></span>${esc(title)} <span class="num">${items.length}</span></h3>
  <div class="list">${items.length?items.map(rowHTML).join(''):`<div class="empty">${esc(emptyTxt)}</div>`}</div></section>`;
}

let IDX={};
function render(){
  document.getElementById('mLbl').textContent=EN_M[cur.getMonth()]+' '+cur.getFullYear();
  const pm=new Date(cur.getFullYear(),cur.getMonth()-1,1);
  document.getElementById('mSub').textContent='บิลงวด '+EN_M[pm.getMonth()]+' · ส่งบัญชีก่อน 15';
  for(const b of document.querySelectorAll('#tabs button')) b.setAttribute('aria-selected',b.dataset.v===view);
  const V=document.getElementById('view');
  if(!db){V.innerHTML='';return;}
  if(!ready.t||!ready.s){V.innerHTML='<div class="empty">กำลังโหลดข้อมูล…</div>';return;}
  if(!Object.keys(T).length){V.innerHTML='<div class="empty">ยังไม่มีรายการหลัก — ให้ Little Bank seed ข้อมูลจาก Excel ก่อน</div>';return;}

  const month=genMonth(cur.getFullYear(),cur.getMonth());
  const near=around();
  IDX={}; for(const i of near.concat(month)) IDX[i.id]=i;

  // today
  const act=near.filter(i=>!i.done&&!i.dormant);
  const over=act.filter(i=>i.overdue).sort(sortA);
  const chase=act.filter(i=>i.chase&&!i.overdue).sort(sortA);
  const dueT=act.filter(i=>!i.overdue&&!i.chase&&i.due&&diff(i.due,today)===0).sort(sortA);
  const soon=act.filter(i=>!i.overdue&&!i.chase&&i.due&&diff(i.due,today)>0&&diff(i.due,today)<=3).sort(sortA);
  const tCount=over.length+chase.length+dueT.length+todoDue().length;
  document.getElementById('c-todo').textContent=tdList().filter(t=>!t.done).length;
  // week Mon-Sun
  const wS=addDays(today,-((today.getDay()+6)%7)), wE=addDays(wS,6);
  const inWeek=i=>{const d=i.action||i.due; return d&&d>=wS&&d<=wE;};
  const weekItems=near.filter(i=>!i.dormant&&(inWeek(i)||(i.overdue)));
  const mActive=month.filter(i=>!i.dormant);
  const mDone=mActive.filter(i=>i.done).length;

  const ct=document.getElementById('c-today'); ct.textContent=tCount; ct.classList.toggle('hot',over.length>0);
  document.getElementById('c-week').textContent=weekItems.filter(i=>!i.done).length;
  document.getElementById('c-month').textContent=mActive.length-mDone;

  const mOver=mActive.filter(i=>i.overdue).length, mChase=mActive.filter(i=>i.chase&&!i.overdue).length;
  const pct=mActive.length?Math.round(mDone/mActive.length*100):0;
  document.getElementById('kpis').innerHTML=`
   <div class="kpi"><div class="v num">${mDone}<span style="font-size:14px;color:var(--muted)"> / ${mActive.length}</span></div><div class="l">เสร็จเดือน ${EN_M[cur.getMonth()]} (${pct}%)</div><div class="bar"><i style="width:${pct}%"></i></div></div>
   <button class="kpi red" data-goto="today"><div class="v num">${mOver}</div><div class="l">เลยกำหนด</div></button>
   <button class="kpi amber" data-goto="today"><div class="v num">${mChase}</div><div class="l">ต้องตามเอกสาร</div></button>
   <div class="kpi"><div class="v num">${mActive.filter(i=>!i.done&&['03','04','05','06','07','10'].includes(i.status)).length}</div><div class="l">อยู่ระหว่างทำ</div></div>
   <div class="kpi"><div class="v num">${month.filter(i=>i.dormant).length}</div><div class="l">ตามบิล · ยังไม่มีบิล</div></div>`;

  document.getElementById('fKind').hidden=(view==='cost'||view==='todo'); document.getElementById('addBtn').hidden=(view==='cost'||view==='todo');
  if(view==='todo'){ const f=document.activeElement&&document.activeElement.id==='tdIn'; const v=f?document.activeElement.value:null; renderTodo(V); if(f){const i=document.getElementById('tdIn');i.value=v;i.focus();} renderBulk(); if(openId) renderDrawer(); return; }
  if(view==='cost'){ renderCost(V); renderBulk(); if(openId) renderDrawer(); return; }
  let h='';
  if(view==='today'){
    h+=listSec('เลยกำหนด','red',filt(over));
    h+=listSec('ต้องตามเอกสารจาก vendor','amber',filt(chase));
    h+=listSec('ครบกำหนดวันนี้','acc',filt(dueT), (over.length||chase.length)?'':'วันนี้ไม่มีงานครบกำหนด');
    h+=listSec('ใน 3 วันข้างหน้า','',filt(soon));
    h+=todoTodaySec();
  } else if(view==='week'){
    const days=[...Array(7)].map((_,k)=>addDays(wS,k));
    h+=`<section class="sec"><h3><span class="dot acc"></span>${fmt(wS)} – ${fmt(wE)}</h3><div class="week">${days.map(d=>{
      const its=filt(near.filter(i=>!i.dormant&&(i.action||i.due)&&ymd(i.action||i.due)===ymd(d))).sort(sortA);
      return `<div class="day${ymd(d)===ymd(today)?' today':''}"><h5><span>${fmtD(d)}</span><span class="num">${its.length||''}</span></h5>${its.map(i=>`<button class="chip b-${i.overdue?'block':i.bucket}" data-open="${esc(i.id)}">${esc(i.t.title)}</button>`).join('')}${todoChips(d)}</div>`;}).join('')}</div></section>`;
    h+=listSec('งานสัปดาห์นี้ (รวมที่เลยกำหนด)','',filt(weekItems).sort((a,b)=>(a.done-b.done)||sortA(a,b)),'สัปดาห์นี้ว่าง');
  } else if(view==='month'){
    const bills=filt(month.filter(i=>i.t.kind==='bill'&&!i.dormant)).sort((a,b)=>(a.done-b.done)||sortA(a,b));
    const rts=filt(month.filter(i=>i.t.kind!=='bill')).sort((a,b)=>(a.done-b.done)||sortA(a,b));
    const dorm=filt(month.filter(i=>i.dormant)).sort((a,b)=>(a.t.order||0)-(b.t.order||0));
    h+=listSec('วางบิล','acc',bills,'ไม่มีบิลในเดือนนี้');
    h+=listSec('งานประจำ (SOP)','green',rts);
    if(dorm.length) h+=`<details class="dormant sec"><summary>ตามบิล / ส่งของ — ยังไม่มีบิลเข้า (${dorm.length})</summary><div class="list">${dorm.map(rowHTML).join('')}</div></details>`;
  } else if(view==='board'){
    const bills=filt(month.filter(i=>i.t.kind==='bill'&&!i.dormant&&i.bucket!=='skip'));
    h+=`<div class="board">${BOARD.map(([b,l])=>{const its=bills.filter(i=>i.bucket===b||(b==='ipro'&&i.bucket==='block')).sort(sortA);
      return `<div class="col"><h4><span>${l}</span><span class="num">${its.length}</span></h4>${its.map(i=>{const nx=NEXT_B[i.status];return `<div class="card"><div class="ttl" data-open="${esc(i.id)}">${esc(i.t.title)}</div><div class="meta">${i.bucket==='block'?'<span class="tag red">ไม่ Approve</span>':''}<span>${esc(stepOf(i.t,i.status).t)}</span></div><div class="ft">${dateCell(i)}${nx?`<button class="next" data-next="${esc(i.id)}">→</button>`:''}</div></div>`}).join('')}</div>`;}).join('')}</div>`;
  } else if(view==='master'){
    const ts=Object.values(T).sort((a,b)=>(a.kind>b.kind?1:-1)||(a.order||0)-(b.order||0));
    const q=document.getElementById('q').value.trim().toLowerCase(), k=document.getElementById('fKind').value;
    const fl=ts.filter(t=>(!k||t.kind===k)&&(!q||[t.title,t.vendor,t.vendorCode].join(' ').toLowerCase().includes(q)));
    h+=`<p class="note">รายการหลักคือ "แม่แบบ" — ระบบสร้างงานให้อัตโนมัติทุกเดือน/สัปดาห์จากตรงนี้ แก้วันรับเอกสาร/กำหนดส่งได้โดยคลิกแถว</p>
    <div class="tbl"><table><thead><tr><th>รายการ</th><th>Vendor code</th><th>รอบ</th><th>ได้เอกสาร</th><th>กำหนด</th><th>ชำระ</th><th>ใช้งาน</th></tr></thead><tbody>${fl.map(t=>`<tr data-tpl="${esc(t.id)}"><td><b>${esc(t.title)}</b>${t.confirm?' <span class="tag warn">ยืนยัน</span>':''}<div class="note">${esc((t.items||[]).map(x=>x.desc).join(' · ')).slice(0,120)}</div></td><td class="num">${esc(t.vendorCode||'')}</td><td>${t.cadence==='weekly'?'สัปดาห์':t.cadence==='monthly'?(t.adhoc?'ตามบิล':'เดือน'):'ครั้งเดียว'}</td><td>${t.receiveDay?'วันที่ '+t.receiveDay:(t.kind==='bill'?'ตามบิล':'—')}</td><td>${t.cadence==='once'?esc(t.dueDate):t.cadence==='weekly'?'จบสัปดาห์ +'+(t.dueOffset??1):'วันที่ '+(t.dueDay||15)}</td><td>${esc(t.pay||'')}</td><td>${t.active===false?'ปิด':'✓'}</td></tr>`).join('')}</tbody></table></div>`;
  }
  V.innerHTML=h||'<div class="empty">ไม่มีรายการ</div>';
  renderBulk();
  if(openId) renderDrawer();
}
function renderBulk(){
  const b=document.getElementById('bulk'); b.hidden=sel.size===0;
  document.getElementById('bulkN').textContent=sel.size+' รายการ';
  const s=document.getElementById('bulkSel');
  if(!s.options.length) s.innerHTML=BILL.map(x=>`<option value="${x.k}">${esc(x.t)}</option>`).join('')+'<option value="99">(งานประจำ) เสร็จแล้ว</option>';
}

/* ---------- writes ---------- */
const queue={};
function write(id,patch){
  const i=IDX[id]; const base=S[id]||{};
  const next=Object.assign({},base,patch,{updatedAt:new Date().toISOString()});
  if(i&&!next.adhocTask){next.templateId=i.t.id;next.period=i.period;next.title=i.t.title;}
  if(patch.status&&patch.status!==base.status){
    const log=(base.log||[]).slice(-19); log.push({s:patch.status,at:next.updatedAt}); next.log=log;
  }
  delete next.id; S[id]=Object.assign({id},next); render();

function chartSVG(t,latest){

  t.forEach((v,k)=>{const x=pl+k*bw+bw*.18, w=bw*.64; if(v>0) g+=`<rect class="bar-r${k>latest?' old':''}" x="${x}" y="${y(v)}" width="${w}" height="${Math.max(1,H-pb-y(v))}" rx="3"><title>${EN_M[k]}: ${nf(v)}</title></rect>`;

function loadXLSX(){return new Promise((ok,no)=>{if(window.XLSX) return ok(window.XLSX);const sc=document.createElement('script');sc.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';sc.onload=()=>ok(window.XLSX);sc.onerror=()=>no(new Error('โหลดตัวอ่าน Excel ไม่ได้'));document.head.appendChild(sc);});}
const sv=v=>v==null?'':(typeof v==='number'&&Number.isInteger(v)?String(v):String(v).trim());
const nv=v=>typeof v==='number'?Math.round(v*100)/100:null;
function parseBook(X,wb){
  const name=wb.SheetNames.find(n=>/^Expence CFM/i.test(n)); if(!name) throw new Error('ไม่เจอชีต Expence CFM 2026');
  const A=X.utils.sheet_to_json(wb.Sheets[name],{header:1,raw:true,defval:null});
  const secs=[]; let cur=null,grp=null,vname='',vno='',loc='',grand=null;
  const closeGrp=()=>{if(!grp) return; const b=grp.find(r=>r.store||r.cpc||r.acc); if(b) for(const r of grp) for(const k of ['store','cpc','acc','sub']) if(!r[k]&&b[k]){r[k]=b[k];r.inferred=true;}};
  for(let i=2;i<A.length;i++){
    const R=A[i]||[], g=c=>R[c]??null, months=[...Array(12)].map((_,k)=>nv(g(11+k)));
    if(sv(g(9))==='Total'){grand=months;continue;}
    if(!sv(g(3))&&!sv(g(2))){ if(months.some(v=>v)&&cur){closeGrp();grp=null;cur.subtotal=months;cur=null;} continue; }
    if(!cur){cur={rows:[],loc:''};secs.push(cur);vname='';vno='';loc='';grp=null;}
    if(sv(g(1))||sv(g(2))){closeGrp();grp=[];vname=sv(g(2))||vname;vno=sv(g(4));}
    if(!grp) grp=[];
    if(sv(g(4))) vno=sv(g(4)); if(sv(g(9))) loc=sv(g(9));
    const r={row:i+1,code:sv(g(0)),vendor:vname,detail:sv(g(3)),vendorNo:vno,store:sv(g(5)),cpc:sv(g(6)),acc:sv(g(7)),sub:sv(g(8)),loc,cat:sv(g(10)),m:months,total:nv(g(23))};
    grp.push(r); cur.rows.push(r); if(!cur.loc&&loc) cur.loc=loc;
  }
  closeGrp();
  const used={}; secs.forEach((s,i)=>{const n=s.loc||'Other';used[n]=(used[n]||0)+1;s.name=used[n]===1?n:n+' ('+used[n]+')';s.order=i+1;});
  const calc=[...Array(12)].map((_,k)=>secs.reduce((a,s)=>a+s.rows.reduce((b,r)=>b+(r.m[k]||0),0),0));
  const ok=!grand||calc.every((v,k)=>Math.abs(v-(grand[k]||0))<1);
  // CAPEX
  let capex=[],opex=[];
  const cn=wb.SheetNames.find(n=>/^CAPEX BL/i.test(n)), bn=wb.SheetNames.find(n=>/^CAPEX BG/i.test(n)), on=wb.SheetNames.find(n=>/^OPEX BG/i.test(n));
  if(cn){const C=X.utils.sheet_to_json(wb.Sheets[cn],{header:1,raw:true,defval:null});
    const BG=bn?X.utils.sheet_to_json(wb.Sheets[bn],{header:1,raw:true,defval:null}).slice(1).filter(r=>r&&r[0]!=null):[]; let k=0;
    for(let i=5;i<C.length;i++){const R=C[i]||[]; const d=sv(R[11]); if(!d||d==='Total'||!sv(R[3])) continue;
      const it={desc:d,store:sv(R[3]),cpc:sv(R[4]),life:sv(R[12]),unit:sv(R[14]),price:nv(R[15]),budget:[...Array(12)].map((_,j)=>nv(R[16+j])),budgetTotal:nv(R[28]),actual:[...Array(12)].map((_,j)=>nv(R[31+j])),actualTotal:nv(R[43]),balance:nv(R[44])};
      const b=BG[k++]; if(b){it.project=sv(b[3]);it.task=sv(b[4]);it.bgDesc=sv(b[5]);it.bgAmount=nv(typeof b[6]==='string'?Number(b[6]):b[6]);it.amountMatch=it.bgAmount===it.budgetTotal;}
      capex.push(it);}}
  if(on){const O=X.utils.sheet_to_json(wb.Sheets[on],{header:1,raw:true,defval:null});
    for(let i=3;i<O.length;i++){const R=O[i]||[]; if(R[2]) opex.push({area:sv(R[0]),wh:sv(R[1]),project:sv(R[2]),task:sv(R[3]),desc:sv(R[4])});}}
  return {secs,grand,check:{ok},capex,opex};
}

function tdMatch(t){const q=document.getElementById('q').value.trim().toLowerCase();return !q||[t.title,t.notes,t.tag].join(' ').toLowerCase().includes(q);}
function todoRow(t){
  const d=tdDate(t), dd=d?diff(d,today):null, sub=t.sub||[], sd=sub.filter(x=>x.d).length;
  const dateTxt=t.done?`<div class="date"><b>เสร็จ</b><span>${t.doneAt?fmt(new Date(t.doneAt)):''}</span></div>`
    : !d?'<div class="date"><span>ไม่มีกำหนด</span></div>'
    : dd<0?`<div class="date red"><b>เลย ${-dd} วัน</b><span>${fmtD(d)}</span></div>`
    : `<div class="date${dd<=1?' amber':''}"><b>${dd===0?'วันนี้':dd===1?'พรุ่งนี้':'อีก '+dd+' วัน'}</b><span>${fmtD(d)}</span></div>`;
  return `<div class="row td${t.done?' isdone':''}">
    <div class="c1"><input type="checkbox" data-td="${esc(t.id)}" ${t.done?'checked':''} aria-label="ทำเสร็จ ${esc(t.title)}"></div>
    <div class="c2">${t.prio==='high'?'<span class="tag red">ด่วน</span>':t.prio==='low'?'<span class="tag">ไว้ก่อน</span>':''}</div>
    <div class="c3"><div class="ttl" data-tdopen="${esc(t.id)}">${esc(t.title)}</div><div class="meta">${t.tag?`<span class="tag acc">${esc(t.tag)}</span>`:''}${sub.length?`<span>☑ ${sd}/${sub.length}</span>`:''}${t.notes?`<span>${esc(t.notes.slice(0,70))}${t.notes.length>70?'…':''}</span>`:''}</div></div>
    <div class="c4">${dateTxt}</div>
    <div class="c5">${t.done?'':`<button class="next" data-tdsnooze="${esc(t.id)}" title="เลื่อนไปพรุ่งนี้">→ พรุ่งนี้</button>`}</div></div>`;
}
function tdSec(title,dot,items,empty){
  if(!items.length&&!empty) return '';
  return `<section class="sec"><h3><span class="dot ${dot}"></span>${esc(title)} <span class="num">${items.length}</span></h3><div class="list">${items.length?items.map(todoRow).join(''):`<div class="empty">${esc(empty)}</div>`}</div></section>`;
}
function todoTodaySec(){const it=tdList().filter(t=>!t.done&&t.due&&tdDate(t)<=today&&tdMatch(t)).sort(tdSort);return tdSec('To-do ของกู — วันนี้ / ค้าง','acc',it);}
function todoChips(d){return tdList().filter(t=>t.due===ymd(d)&&tdMatch(t)).sort(tdSort).map(t=>`<button class="chip ${t.done?'b-done':'b-todo'}" data-tdopen="${esc(t.id)}">☐ ${esc(t.title)}</button>`).join('');}
function renderTodo(V){
  const all=tdList().filter(tdMatch), open=all.filter(t=>!t.done);
  const wE=addDays(today,6-((today.getDay()+6)%7));
  const g={over:[],today:[],tmr:[],week:[],later:[],none:[]};
  for(const t of open){const d=tdDate(t); if(!d) g.none.push(t); else {const x=diff(d,today); if(x<0) g.over.push(t); else if(x===0) g.today.push(t); else if(x===1) g.tmr.push(t); else if(d<=wE) g.week.push(t); else g.later.push(t);}}
  for(const k in g) g[k].sort(tdSort);
  const done=all.filter(t=>t.done).sort((a,b)=>String(b.doneAt).localeCompare(String(a.doneAt)));
  const quick=[['วันนี้',ymd(today)],['พรุ่งนี้',ymd(addDays(today,1))],['ศุกร์นี้',ymd(addDays(today,((5-today.getDay())+7)%7))],['จันทร์หน้า',ymd(addDays(today,((8-today.getDay())%7)||7))],['ไม่มีกำหนด','']];
  let h=`<form class="tdadd" id="tdForm" autocomplete="off">
    <input id="tdIn" class="tdin" placeholder="เพิ่มงานให้ตัวเอง แล้วกด Enter — เช่น โทรตาม Logisteed เรื่องบิล backhaul" aria-label="งานใหม่" maxlength="200">
    <div class="tdopts">
      <div class="chips">${quick.map(([l,v])=>`<button type="button" class="fchip" data-tddue="${v}" aria-pressed="${tdDue===v}">${l}</button>`).join('')}
        <input type="date" id="tdDate" class="mini" value="${esc(tdDue)}" aria-label="กำหนดเอง"></div>
      <div class="chips">${Object.entries(PRIO).map(([k,l])=>`<button type="button" class="fchip" data-tdprio="${k}" aria-pressed="${tdPrio===k}">${l}</button>`).join('')}
        <button class="btn primary" type="submit">เพิ่ม</button></div>
    </div></form>`;
  h+=tdSec('เลยกำหนด','red',g.over);
  h+=tdSec('วันนี้','acc',g.today,open.length?'วันนี้ไม่มี to-do — เพิ่มด้านบนได้เลย':'ยังไม่มี to-do — พิมพ์ด้านบนแล้วกด Enter');
  h+=tdSec('พรุ่งนี้','',g.tmr); h+=tdSec('สัปดาห์นี้','',g.week); h+=tdSec('ถัดไป','',g.later); h+=tdSec('ไม่มีกำหนด','',g.none);
  if(done.length) h+=`<details class="dormant sec" ${tdShowDone?'open':''} id="tdDone"><summary>เสร็จแล้ว (${done.length})</summary><div class="list">${done.slice(0,50).map(todoRow).join('')}</div></details>`;
  V.innerHTML=h;
}
async function tdWrite(id,patch){
  const cur=TD[id]||{}; const next=Object.assign({},cur,patch,{updatedAt:new Date().toISOString()}); delete next.id;
  TD[id]=Object.assign({id},next); render();
  queue['td:'+id]=(queue['td:'+id]||Promise.resolve()).then(()=>db.doc('todos/'+id).set(next)).then(()=>flash('บันทึกแล้ว')).catch(e=>flash('บันทึกไม่สำเร็จ: '+(e&&e.code||'error')));
  return queue['td:'+id];
}
function tdAdd(){
  const inp=document.getElementById('tdIn'); const title=inp.value.trim(); if(!title) return;
  const id='td'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
  const due=(document.getElementById('tdDate')||{}).value||tdDue||'';
  tdWrite(id,{title,due:due||null,prio:tdPrio,notes:'',tag:'',sub:[],done:false,createdAt:new Date().toISOString()});
  setTimeout(()=>{const i=document.getElementById('tdIn'); if(i){i.value='';i.focus();}},0);
}
function renderTodoD(D,first){
  const t=TD[openId.slice(5)]; if(!t){closeD();return;}
  if(!first&&D.contains(document.activeElement)&&document.activeElement.matches('input,textarea,select')) return;
  const sub=t.sub||[];
  D.innerHTML=`<div class="dh"><h2>To-do<div class="note">สร้าง ${t.createdAt?esc(new Date(t.createdAt).toLocaleString('th-TH',{dateStyle:'medium',timeStyle:'short'})):''}</div></h2><button class="btn ghost" id="dClose" aria-label="ปิด">✕</button></div>
  <div class="db">
    <label class="chk" style="font-size:14px"><input type="checkbox" data-td="${esc(t.id)}" ${t.done?'checked':''}> <span>${t.done?'เสร็จแล้ว':'ทำเครื่องหมายว่าเสร็จ'}</span></label>
    <div class="fld"><label for="tdT">งาน</label><input id="tdT" value="${esc(t.title)}" maxlength="200"></div>
    <div class="two"><div class="fld"><label for="tdD">กำหนด</label><input id="tdD" type="date" value="${esc(t.due||'')}"></div>
      <div class="fld"><label for="tdP">ความสำคัญ</label><select id="tdP">${Object.entries(PRIO).map(([k,l])=>`<option value="${k}"${(t.prio||'normal')===k?' selected':''}>${l}</option>`).join('')}</select></div></div>
    <div class="fld"><label for="tdG">แท็ก (เช่น DHL, CAPEX, ประชุม)</label><input id="tdG" value="${esc(t.tag||'')}" maxlength="40"></div>
    <div class="fld"><label for="tdN">โน้ต</label><textarea id="tdN">${esc(t.notes||'')}</textarea></div>
    <div><p class="lbl2">ขั้นตอนย่อย</p>${sub.map((x,k)=>`<div class="chk" style="align-items:center"><input type="checkbox" data-tdsub="${k}" ${x.d?'checked':''}> <span style="flex:1${x.d?';text-decoration:line-through;color:var(--muted)':''}">${esc(x.t)}</span><button class="btn ghost" data-tdsubdel="${k}" aria-label="ลบขั้นตอน">✕</button></div>`).join('')}
      <form id="tdSubF" style="display:flex;gap:6px;margin-top:6px"><input id="tdSubIn" class="search" style="flex:1;width:auto" placeholder="เพิ่มขั้นตอน แล้วกด Enter" maxlength="120"><button class="btn" type="submit">เพิ่ม</button></form></div>
    <div class="saved" aria-live="polite"></div>
    <div id="tdDelBox"><button class="btn ghost" id="tdDel">ลบงานนี้</button></div>
  </div>`;
  if(first) D.querySelector('#tdT').focus();
}
function tdOpen(id){openId='todo:'+id;document.getElementById('scrim').hidden=false;document.getElementById('drawer').hidden=false;renderDrawer(true);}
document.addEventListener('submit',e=>{
  if(e.target.id==='tdForm'){e.preventDefault();tdAdd();}
  else if(e.target.id==='tdSubF'){e.preventDefault();const id=openId.slice(5),t=TD[id],v=document.getElementById('tdSubIn').value.trim(); if(!t||!v) return;
    tdWrite(id,{sub:(t.sub||[]).concat([{t:v,d:false}])}).then(()=>{}); renderDrawer(true); setTimeout(()=>document.getElementById('tdSubIn')?.focus(),0);}
});
document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-tdopen],[data-tdsnooze],[data-tddue],[data-tdprio],[data-tdsubdel],#tdDel,#tdDelYes,#tdDelNo,#tdDone summary'); if(!el) return;
  if(el.dataset.tdopen) tdOpen(el.dataset.tdopen);
  else if(el.dataset.tdsnooze) tdWrite(el.dataset.tdsnooze,{due:ymd(addDays(today,1))});
  else if(el.dataset.tddue!==undefined){tdDue=el.dataset.tddue;const v=document.getElementById('tdIn').value;render();const i=document.getElementById('tdIn');i.value=v;i.focus();}
  else if(el.dataset.tdprio){tdPrio=el.dataset.tdprio;const v=document.getElementById('tdIn').value;render();const i=document.getElementById('tdIn');i.value=v;i.focus();}
  else if(el.dataset.tdsubdel!==undefined){const id=openId.slice(5),t=TD[id];const sub=(t.sub||[]).slice();sub.splice(+el.dataset.tdsubdel,1);await tdWrite(id,{sub});renderDrawer(true);}
  else if(el.id==='tdDel'){document.getElementById('tdDelBox').innerHTML='<span class="note">ลบถาวร?</span> <button class="btn" id="tdDelYes">ลบ</button> <button class="btn ghost" id="tdDelNo">ยกเลิก</button>';}
  else if(el.id==='tdDelNo'){document.getElementById('tdDelBox').innerHTML='<button class="btn ghost" id="tdDel">ลบงานนี้</button>';}
  else if(el.id==='tdDelYes'){const id=openId.slice(5);closeD();delete TD[id];render();try{await db.doc('todos/'+id).delete();}catch(_){flash('ลบไม่สำเร็จ');}}
  else if(el.matches('#tdDone summary')){tdShowDone=!document.getElementById('tdDone').open;}
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset.td){const id=el.dataset.td;tdWrite(id,{done:el.checked,doneAt:el.checked?new Date().toISOString():null});if(openId==='todo:'+id) setTimeout(()=>renderDrawer(true),0);}
  else if(el.dataset.tdsub!==undefined&&openId&&openId.startsWith('todo:')){const id=openId.slice(5),t=TD[id];const sub=(t.sub||[]).map(x=>Object.assign({},x));sub[+el.dataset.tdsub].d=el.checked;tdWrite(id,{sub}).then(()=>renderDrawer(true));}
  else if(el.id==='tdDate'){tdDue=el.value;}
  else if(['tdD','tdP'].includes(el.id)&&openId&&openId.startsWith('todo:')){tdWrite(openId.slice(5),el.id==='tdD'?{due:el.value||null}:{prio:el.value});}
});
document.addEventListener('input',e=>{
  const el=e.target; if(!['tdT','tdG','tdN'].includes(el.id)||!openId||!openId.startsWith('todo:')) return;
  clearTimeout(el._t); el._t=setTimeout(()=>{const f={tdT:'title',tdG:'tag',tdN:'notes'}[el.id]; const v=f==='title'?el.value.trim():el.value; if(f==='title'&&!v) return; tdWrite(openId.slice(5),{[f]:v});},600);
});

/* ---------- boot ---------- */
render();
(async()=>{
  let dbErr='';
  try{ db=await window.DCStore.connect(); }catch(e){ console.error(e); db=null; dbErr=(e&&e.message)||''; }
  const B=document.getElementById('banner');
  if(!db){B.hidden=false;B.textContent='ต่อฐานข้อมูลไม่ได้'+(dbErr?' ('+dbErr+')':'')+' — รีเฟรชเพื่อลองใหม่';document.getElementById('view').innerHTML='';return;}
  db.collection('templates').onSnapshot(s=>{T={};for(const d of s.docs){T[d.id]=Object.assign({id:d.id},d.data());}ready.t=true;render();},
    e=>{B.hidden=false;B.textContent='โหลดรายการหลักไม่สำเร็จ ('+e.code+') — ลองรีเฟรช';});
  db.collection('tasks').onSnapshot(s=>{const n={};for(const d of s.docs){n[d.id]=Object.assign({id:d.id},d.data());}
    for(const id in S){ if(!n[id]&&queue[id]) n[id]=S[id]; } S=n; ready.s=true; render();},
    e=>{B.hidden=false;B.textContent='โหลดสถานะงานไม่สำเร็จ ('+e.code+') — ลองรีเฟรช';});
  db.collection('todos').onSnapshot(s=>{const n={};for(const d of s.docs){n[d.id]=Object.assign({id:d.id},d.data());}
    for(const id in TD){ if(!n[id]&&queue['td:'+id]) n[id]=TD[id]; } TD=n; render();},()=>{});
  db.collection('ledger').onSnapshot(s=>{let meta=null;const secs=[];for(const d of s.docs){const x=d.data(); if(d.id==='meta') meta=x; else secs.push(x);}
    secs.sort((a,b)=>(a.order||0)-(b.order||0)); LED={meta,secs}; ready.l=true; render();},()=>{});
  db.collection('ref').onSnapshot(s=>{const r={capex:[],opex:[]};for(const d of s.docs){r[d.id]=d.data().rows||[];} REF=r; render();},()=>{});
})();
})();
</script>
</body>
